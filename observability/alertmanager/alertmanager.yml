global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: "ai-triage-webhook"

receivers:
  - name: "ai-triage-webhook"
    webhook_configs:
      - url: "http://triage-bot:5001/alerts"
        send_resolved: true
