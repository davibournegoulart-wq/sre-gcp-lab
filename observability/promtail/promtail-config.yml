server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # The old static paths (/var/log/app/*.log) were never mounted, so nothing
  # reached Loki. Container logs now come through docker-proxy, a read-only
  # filtered view of the Docker API — promtail never touches the raw socket.
  - job_name: containers
    docker_sd_configs:
      - host: tcp://docker-proxy:2375
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=sre-gcp-lab"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - target_label: env
        replacement: local
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
      - labels:
          level:
