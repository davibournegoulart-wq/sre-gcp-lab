<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Crosshair Reticle Ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#F8FAFC" stroke-width="24"/>

  <!-- Crosshair Ticks (12, 6, 9, 3 o'clock) -->
  <line x1="512" y1="121" x2="512" y2="244" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round"/>
  <line x1="512" y1="780" x2="512" y2="903" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round"/>
  <line x1="121" y1="512" x2="244" y2="512" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round"/>
  <line x1="780" y1="512" x2="903" y2="512" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round"/>

  <!-- Tactical Chessboard Grid -->
  <!-- Top-Left -->
  <rect x="331" y="331" width="122" height="122" rx="18" fill="#F8FAFC"/>
  <!-- Top-Right -->
  <rect x="571" y="331" width="122" height="122" rx="18" fill="#F8FAFC"/>
  <!-- Bottom-Left -->
  <rect x="331" y="571" width="122" height="122" rx="18" fill="#F8FAFC"/>
  <!-- Bottom-Right -->
  <rect x="571" y="571" width="122" height="122" rx="18" fill="#F8FAFC"/>

  <!-- Focal Checkmate Center Target (Amber) -->
  <rect x="451" y="451" width="122" height="122" rx="18" fill="#FFB020"/>
</svg>