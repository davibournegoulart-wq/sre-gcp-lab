name: CI

on:
  push:
    branches: [main, suite-mission-control]
  pull_request:
    branches: [main]

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_IMAGE: prom/prometheus:v2.55.1
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.1
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  KUBECONFORM_VERSION: v0.6.7

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            triage-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r triage-bot/requirements.txt pytest flake8

      # Blocking: syntax errors and undefined names only.
      - name: Lint (blocking)
        run: flake8 app triage-bot scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics

      # Advisory: style and complexity, never fails the build.
      - name: Lint (advisory)
        run: flake8 app triage-bot scripts tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Same command as `make unit`, without the container wrapper.
      - name: Unit tests
        run: python -m pytest -q tests/unit

  security:
    name: Secrets and hardening audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # security-check.py walks `git log --all -p`; a shallow clone would hide history.
          fetch-depth: 0

      - name: security-check.py
        run: python3 scripts/security-check.py

  config:
    name: Validate observability, Kubernetes and Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: promtool check config and rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check rules /etc/prometheus/alerts.yml

      - name: amtool check-config
        run: |
          # The config reads a bearer token from a file that only exists after `make secrets`.
          mkdir -p "$RUNNER_TEMP/secrets"
          echo "ci-placeholder-token" > "$RUNNER_TEMP/secrets/alert_webhook_token"
          docker run --rm --entrypoint amtool \
            -v "$PWD/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$RUNNER_TEMP/secrets/alert_webhook_token:/run/secrets/alert_webhook_token:ro" \
            "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml

      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary k8s/

      - name: docker compose config
        env:
          # Compose fails fast on unset required variables; these are throwaway CI values.
          CHAOS_TOKEN: ci-placeholder-chaos-token-000000000000
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-password
        run: docker compose config --quiet

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8 # 1.6.x cannot verify current provider signatures (openpgp: key expired)

      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      # No credentials and no remote state: validate only. A `plan` needs GCP auth.
      - name: init and validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  images:
    name: Build, smoke test and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, security, config, terraform]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: app
            port: 8000
            health: /healthz
            env: "-e CHAOS_ENABLED=false -e CHAOS_TOKEN=ci-placeholder-chaos-token-000000000000"
          - name: triage-bot
            context: triage-bot
            port: 5001
            health: /healthz
            env: "-e ALERT_WEBHOOK_TOKEN=ci-placeholder-webhook-token-0000000000000"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: sre-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test ${{ matrix.name }}
        run: |
          docker run -d --name smoke -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.env }} sre-${{ matrix.name }}:ci
          for i in $(seq 1 30); do
            curl -sf "http://localhost:${{ matrix.port }}${{ matrix.health }}" && exit 0
            sleep 1
          done
          echo "Health check never passed; container logs:"
          docker logs smoke
          exit 1

      - name: Container runs as non-root
        run: |
          uid=$(docker exec smoke id -u)
          echo "uid=$uid"
          [ "$uid" != "0" ]

      # Gate: CRITICAL with an available fix fails the build.
      - name: Trivy (gate on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            sre-${{ matrix.name }}:ci

      # Visibility: HIGH is reported but does not fail the build.
      - name: Trivy (report HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --severity HIGH --ignore-unfixed --exit-code 0 \
            sre-${{ matrix.name }}:ci

  iac-scan:
    name: Trivy config scan (Dockerfiles, k8s, Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 0 /src
